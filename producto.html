<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Producto — Artelleria</title>
    <link rel="stylesheet" href="./CSS/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <meta charset="utf-8">
</head>
<body>

    <header class="header-mobile">
        <h1 class="logo">Artelleria</h1>
        <button class="open-menu" id="open-menu"><i class="bi bi-list"></i></button>
        <div class="wrapper">
    </header>

    <aside>
        <header><h1 class="logo">Artelleria</h1></header>
        <nav>
            <button class="close-menu" id="close-menu"><i class="bi bi-x"></i></button>
            <ul class="menu">
                <li><button id="cuadros" class="boton-menu boton-categoria">Cuadros</button></li>
                <li><button id="esculturas" class="boton-menu boton-categoria">Esculturas</button></li>
                <li><button id="mas" class="boton-menu boton-categoria">Más</button></li>
                <li><a class="boton-menu boton-carrito" href="./carrito.html"><i class="bi bi-cart-fill"></i> Carrito <span id="numerito" class="numerito">0</span></a></li>
                <li><button id="todos" class="boton-menu boton-categoria">Toda la galería</button></li>
            </ul>
        </nav>
        <footer><p class="texto-footer">© 2025 Artelleria</p></footer>
    </aside>

    <main>
        <div class="product-page" id="product-page">

            <div class="product-gallery">
                <div class="main-image">
                <img id="main-image" src="" alt="Imagen principal">
            </div>
            <div class="thumbs" id="thumbs"></div>
        </div>

        <div class="product-info">
            <h1 class="product-title" id="product-title">Título</h1>
            <div class="product-price" id="product-price">$0</div>

            <div class="buy-section">
                <input type="number" min="1" value="1" class="qty-input" id="qty-input">
                <button class="add-to-cart" id="add-to-cart">AGREGAR AL CARRITO</button>
            </div>

        <div class="product-category" id="product-category">Categoría: —</div>

        <h2>Descripción</h2>
        <p class="description" id="product-description">—</p>

        <h2>Especificaciones</h2>
        <ul class="spec-list" id="spec-list"></ul>

        </div>

    </div>
    </main>
</div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="./js/menu.js"></script>
    <script src="./js/producto.js"></script>
</body>
</html>
