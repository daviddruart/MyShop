<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE-edge">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Artelleria</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="CSS/main.css">
</head>
<body>

    <div class="wrapper">
        <aside>
            <header>
                <h1 class="logo">Artelleria</h1>
            </header>
            <nav>
                <ul>
                    <li>
                        <button class="boton-categoria">
                            <i class="bi bi-hand-index-thumb-fill"></i>
                            Todas las obras
                        </button>
                    </li>
                    <li>
                        <button class="boton-categoria">
                            <i class="bi bi-hand-index-thumb"></i>
                            Arte
                        </button>
                    </li>
                    <li>
                        <button class="boton-categoria">
                            <i class="bi bi-hand-index-thumb"></i>
                            Cuadros estampados
                        </button>
                    </li>
                    <li>
                        <button class="boton-categoria">
                            <i class="bi bi-hand-index-thumb"></i>
                            Manualidades
                        </button>
                    </li>
                    <li>
                        <a href="/carrito.html">
                            <i class="bi bi-cart-fill"></i>
                            Carrito
                            <span class="numerito">0</span>
                        </a>
                    </li>
                </ul>
            </nav>
            <footer>
                <p class="texto-footer">© 2025 Artelleria</p>
            </footer>
        </aside>
        <main>
            <h2 class="titulo-principal">Todos los productos</h2>
            <div class="contenedor-productos">
                <div class="producto">
                    <img class="producto-imagen" src="img/jinx01.jpg" alt="">
                    <div class="producto-detalles">Dibujo 01</div>
                    <p class="producto-precio">$100.000</p>
                    <button class="producto-agregar">Agregar</button>
                </div>
                <div class="producto">
                    <img class="producto-imagen" src="img/Sally01.jpg" alt="">
                    <div class="producto-detalles">Dibujo 02</div>
                    <p class="producto-precio">$90.000</p>
                    <button class="producto-agregar">Agregar</button>
                </div>
                <div class="producto">
                    <img class="producto-imagen" src="img/Akali01.jpg" alt="">
                    <div class="producto-detalles">Dibujo 03</div>
                    <p class="producto-precio">$140.000</p>
                    <button class="producto-agregar">Agregar</button>
                </div>
                <div class="producto">
                    <img class="producto-imagen" src="img/Dark01.jpg" alt="">
                    <div class="producto-detalles">Dibujo 04</div>
                    <p class="producto-precio">$190.000</p>
                    <button class="producto-agregar">Agregar</button>
                </div>
            </div>
        </main>
    </div>
    
    <script src="js/main.js"></script>
</body>
</html>
