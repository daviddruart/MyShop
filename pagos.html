<body class="store-page checkout-page"><div class="grain" aria-hidden="true"></div><header class="site-header"><nav class="site-nav"><a href="./index.html" class="logo"><span class="logo-eye"></span>MYSHOP</a><span class="checkout-step">01 / Datos de entrega</span><a href="./carrito.html" class="nav-cart">← Volver al carrito</a></nav></header>
<main class="store-main"><div class="page-intro"><span class="eyebrow">Último paso / 02</span><h1>Hazlo tuyo.</h1><p>Completa tus datos y prepararemos tu pieza para el viaje.</p></div><section class="checkout-layout"><div class="checkout-form-panel"><span class="label">Información de entrega</span><h2>¿A dónde enviamos?</h2><form id="form-pagos" class="pagos-form"><div class="form-grid"><div class="form-group form-wide"><label for="cliente-nombre">Nombre completo *</label><input type="text" id="cliente-nombre" name="cliente_nombre" placeholder="Tu nombre" required></div><div class="form-group"><label for="cliente-email">Email *</label><input type="email" id="cliente-email" name="cliente_email" placeholder="tu@correo.com" required></div><div class="form-group"><label for="cliente-telefono">Teléfono</label><input type="tel" id="cliente-telefono" name="cliente_telefono" placeholder="+57 300 000 0000"></div><div class="form-group form-wide"><label for="cliente-direccion">Dirección *</label><input type="text" id="cliente-direccion" name="cliente_direccion" placeholder="Calle, número, apartamento" required></div><div class="form-group"><label for="cliente-ciudad">Ciudad *</label><input type="text" id="cliente-ciudad" name="cliente_ciudad" placeholder="Bogotá" required></div><div class="form-group"><label for="cliente-codigo-postal">Código postal</label><input type="text" id="cliente-codigo-postal" name="cliente_codigo_postal" placeholder="110111"></div><div class="form-group form-wide"><label for="cliente-notas">Notas de entrega</label><textarea id="cliente-notas" name="cliente_notas" placeholder="¿Algo que debamos saber?" rows="3"></textarea></div></div><div class="pagos-botones"><a href="./carrito.html" class="btn-secondary">← Volver</a><button type="submit" class="btn-primary btn-pagar">Completar compra <i class="bi bi-arrow-up-right"></i></button></div></form></div><aside class="checkout-summary"><span class="label">Tu selección</span><h2>Resumen de orden</h2><div id=
